<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chase</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0f1a;--fg:#e8ecf5}
:root[data-theme="light"]{--bg:#0b0f1a;--fg:#e8ecf5}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{max-width:900px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:8px;height:100%;box-sizing:border-box}
#stage{position:relative}
canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:10px;background:#111}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(5,8,16,.78);border-radius:10px;padding:16px}
#ov h1{margin:0 0 6px;font-size:34px;letter-spacing:2px}
#ov p{margin:4px 0;opacity:.85;font-size:14px;max-width:420px}
button{font:inherit;border:0;border-radius:12px;color:#fff;cursor:pointer}
#go{margin-top:14px;background:#e63946;padding:12px 30px;font-size:18px;font-weight:700}
#hint{text-align:center;font-size:14px;opacity:.7;padding:4px 0}
</style></head><body>
<div id="wrap">
<div id="stage"><canvas id="c" width="640" height="360"></canvas>
<div id="ov"><h1 id="t">CHASE</h1><p id="m">Reach the flag before the hunter catches you.</p><p>Jump boxes. Slide under bars. Hitting anything slows you down.</p><p><b>Swipe up</b> to jump &nbsp; <b>swipe down</b> to slide<br>Keyboard: Space / ↑ jump, ↓ / S slide</p><button id="go">START</button></div></div>
<div id="hint">Swipe ↑ to jump · Swipe ↓ to slide · Tap to jump</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const W=640,H=360,G=290,L=7000;
let P,E,obs,state='ready',time=0,flash=0,jb=0,best=null,last=0;
try{best=+localStorage.getItem('chase_best')||null}catch(e){}
function reset(){
  P={x:200,y:0,vy:0,sp:0,slide:0,stun:0,ph:0};
  E={x:-60,sp:300,ph:0};
  obs=[];let x=700;
  while(x<L-500){const bar=Math.random()<.4;obs.push({x,w:bar?50:36,type:bar?'bar':'box',hit:false});x+=320+Math.random()*260}
  time=0;flash=0;jb=0;
}
function jump(){jb=.12}
function slide(){if(P&&P.y===0)P.slide=.55}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}
  if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();slide()}
  if(e.code==='Enter'&&state!=='play')start();
});
let sw=null;
addEventListener('pointerdown',e=>{if(e.target.id==='go')return;sw={x:e.clientX,y:e.clientY,done:false}});
addEventListener('pointermove',e=>{if(!sw||sw.done)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(Math.abs(dy)>24&&Math.abs(dy)>Math.abs(dx)){sw.done=true;dy<0?jump():slide()}});
addEventListener('pointerup',()=>{if(sw&&!sw.done&&state==='play')jump();sw=null});
addEventListener('pointercancel',()=>{sw=null});
document.getElementById('go').onclick=start;
function start(){reset();state='play';ov.style.display='none';last=performance.now();}
function end(win){
  state=win?'win':'lose';
  let msg=win?'You reached the flag first! Time: '+time.toFixed(2)+'s':'The hunter got you.';
  if(win&&(!best||time<best)){best=time;try{localStorage.setItem('chase_best',time)}catch(e){}msg+=' New best!'}
  else if(best)msg+=' Best: '+best.toFixed(2)+'s';
  document.getElementById('t').textContent=win?'YOU WIN':'CAUGHT';
  document.getElementById('m').textContent=msg;
  document.getElementById('go').textContent='PLAY AGAIN';
  ov.style.display='flex';
}
function update(dt){
  time+=dt;
  if(jb>0){jb-=dt;if(P.y===0&&P.stun<=0){P.vy=640;P.slide=0;jb=0}}
  if(P.slide>0)P.slide-=dt;
  P.vy-=1800*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0}
  P.stun-=dt;flash-=dt;
  P.sp+=(372-P.sp)*Math.min(1,dt*1.4);
  P.x+=P.sp*dt;P.ph+=P.sp*dt*.045;
  const h=P.slide>0?26:50;
  for(const o of obs){
    if(o.hit||P.x+12<o.x||P.x-12>o.x+o.w)continue;
    const hitIt=o.type==='box'?P.y<40:(P.y+h>34&&P.y<100);
    if(hitIt){o.hit=true;P.sp*=.35;P.stun=.4;flash=.25}
  }
  const gap=P.x-E.x;
  E.sp=352+Math.max(0,(gap-300))*.2;
  E.x+=E.sp*dt;E.ph+=E.sp*dt*.045;
  if(P.x>=L)return end(true);
  if(E.x>=L||E.x>=P.x-16)return end(false);
}
function fig(x,c,y,slide,ph,fl,en){
  const b=G-y,t=performance.now()/1000,ink=fl?'#fff':'#04060c';
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(x,G+3,16-y/10,3,0,0,7);ctx.fill();
  ctx.shadowColor=c;ctx.shadowBlur=fl?22:12;ctx.strokeStyle=ink;ctx.fillStyle=ink;
  const L2=(w,...p)=>{ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.stroke()};
  let hx,hy;
  if(slide){
    hx=x-20;hy=b-15;
    L2(9,x-14,b-11,x+8,b-12);L2(6,x+8,b-12,x+30,b-4);L2(5,x-6,b-12,x-24,b-4);
  }else if(y>0){
    hx=x+2;hy=b-54;
    L2(9,x,b-24,x,b-46);L2(6,x,b-24,x+12,b-16,x-2,b-8);L2(5,x,b-40,x+14,b-52);L2(5,x,b-40,x-10,b-50);
  }else{
    const s=Math.sin(ph),k=Math.cos(ph);
    hx=x+5;hy=b-54;
    L2(9,x-2,b-24,x+4,b-46);L2(6,x,b-24,x+s*16,b-(k>0?4:0));L2(6,x,b-24,x-s*16,b-(k<0?4:0));
    L2(5,x+4,b-42,x-8,b-36+s*3,x-18,b-30+s*4);L2(5,x+4,b-42,x-6,b-34-s*3,x-14,b-26-s*4);
  }
  ctx.beginPath();ctx.arc(hx,hy,7,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(hx-4,hy-6);ctx.lineTo(hx-17,hy-1);ctx.lineTo(hx-5,hy+5);ctx.fill();
  ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(hx-5,hy+4);ctx.quadraticCurveTo(hx-18,hy+8+Math.sin(t*14)*4,hx-30,hy+5+Math.sin(t*14+1)*5);ctx.stroke();
  if(en&&!slide){ctx.strokeStyle=c;ctx.shadowBlur=14;L2(2.5,x+8,b-36,x+36,b-50)}
  ctx.shadowBlur=8;ctx.fillStyle=fl?'#04060c':c;ctx.fillRect(hx+1,hy-3,6,2.5);
  ctx.restore();
}
function draw(){
  const cam=P.x-200;
  const g=ctx.createLinearGradient(0,0,0,G);g.addColorStop(0,'#10182e');g.addColorStop(1,'#2b3a67');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1a2342';
  const off=cam*.3,i0=Math.floor(off/80);
  for(let i=i0;i<i0+10;i++){const bh=60+((Math.sin(i*12.9898)*43758.5453)%1+1)%1*110;ctx.fillRect(i*80-off,G-bh,64,bh)}
  ctx.fillStyle='#0d1222';ctx.fillRect(0,G,W,H-G);
  ctx.fillStyle='#2e3a66';ctx.fillRect(0,G,W,3);
  ctx.fillStyle='#1b2547';
  for(let x=-(cam%60);x<W;x+=60)ctx.fillRect(x,G+22,30,3);
  for(const o of obs){
    const sx=o.x-cam;if(sx>W||sx+o.w<0)continue;
    if(o.type==='box'){ctx.fillStyle=o.hit?'#7a5b2e':'#d9a441';ctx.fillRect(sx,G-40,o.w,40);ctx.strokeStyle='#8a6420';ctx.lineWidth=2;ctx.strokeRect(sx,G-40,o.w,40)}
    else{ctx.fillStyle='#555e7a';ctx.fillRect(sx+2,G-100,6,66);ctx.fillRect(sx+o.w-8,G-100,6,66);ctx.fillStyle=o.hit?'#7a2a2a':'#e63946';ctx.fillRect(sx,G-66,o.w,32)}
  }
  const fx=L-cam;
  if(fx<W+40){ctx.fillStyle='#ddd';ctx.fillRect(fx,G-120,5,120);
    for(let r=0;r<3;r++)for(let c=0;c<4;c++){ctx.fillStyle=(r+c)%2?'#111':'#fff';ctx.fillRect(fx+5+c*10,G-120+r*10,10,10)}
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(fx-2,0,60,G)}
  fig(E.x-cam,'#e63946',0,false,E.ph,false,true);
  fig(P.x-cam,'#4cc9f0',P.y,P.slide>0&&P.y===0,P.ph,flash>0,false);
  const bx=140,bw=360,by=16;
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(bx,by,bw,6);
  const m=v=>bx+Math.max(0,Math.min(1,v/L))*bw;
  ctx.fillStyle='#e63946';ctx.beginPath();ctx.arc(m(E.x),by+3,6,0,7);ctx.fill();
  ctx.fillStyle='#4cc9f0';ctx.beginPath();ctx.arc(m(P.x),by+3,6,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(bx+bw,by-6,3,18);
  ctx.font='12px system-ui';ctx.fillStyle='#e8ecf5';ctx.textAlign='left';ctx.fillText(time.toFixed(1)+'s',10,22);
  ctx.textAlign='right';ctx.fillText(Math.max(0,Math.round(L-P.x))+'m to go',W-10,22);
  const gp=P.x-E.x;
  if(gp<150&&state==='play'){ctx.fillStyle='rgba(230,57,70,'+(.5-gp/400)+')';ctx.fillRect(0,0,W,H)}
}
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play')update(dt);
  if(P)draw();
  requestAnimationFrame(loop);
}
reset();requestAnimationFrame(t=>{last=t;loop(t)});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
